laravel: '@testbench'

providers:
  - Workbench\App\Providers\AdminPanelProvider

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: true
    views: true
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - filament-assets
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
